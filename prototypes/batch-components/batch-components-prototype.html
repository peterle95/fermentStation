<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Batch components prototype</title>
  <style>
:root {
  --bg:#f5f4ed;--surface:#faf9f5;--surface-warm:#e8e6dc;--fg:#141413;--fg-2:#3d3d3a;--muted:#5e5d59;--meta:#87867f;--border:#f0eee6;--border-soft:#e8e6dc;--accent:#c96442;--accent-on:#faf9f5;--accent-hover:color-mix(in oklab,var(--accent),black 8%);--accent-active:color-mix(in oklab,var(--accent),black 14%);--success:#17a34a;--warn:#eab308;--danger:#b53333;--font-display:"Anthropic Serif",Georgia,"Times New Roman",serif;--font-body:"Anthropic Sans","Arial",system-ui,-apple-system,sans-serif;--font-mono:"Anthropic Mono",ui-monospace,"JetBrains Mono",Menlo,monospace;--text-xs:10px;--text-sm:14px;--text-base:16px;--text-lg:20px;--text-xl:25px;--text-2xl:32px;--text-3xl:52px;--text-4xl:64px;--leading-body:1.6;--leading-tight:1.1;--tracking-display:0em;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--section-y-desktop:96px;--section-y-tablet:64px;--section-y-phone:48px;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--radius-pill:9999px;--elev-flat:none;--elev-ring:0 0 0 1px var(--border);--elev-raised:rgba(0,0,0,.05) 0 4px 24px;--focus-ring:0 0 0 3px rgba(56,152,236,.3);--motion-fast:150ms;--motion-base:200ms;--ease-standard:cubic-bezier(.2,0,0,1);--container-max:1200px;--container-gutter-desktop:24px;--container-gutter-tablet:16px;--container-gutter-phone:12px
}
*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);color:var(--fg);font-family:var(--font-body)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:none;box-shadow:var(--focus-ring)}.workspace{max-width:var(--container-max);margin:auto;padding:72px var(--container-gutter-desktop)}.shell{overflow:hidden;border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--surface);box-shadow:var(--elev-raised)}.progress{display:grid;grid-template-columns:repeat(4,1fr);height:5px;background:var(--border)}.progress span{background:var(--fg)}.progress span:last-child{background:var(--accent)}.batch-grid{display:grid;grid-template-columns:1.05fr 1fr 1.15fr 1.15fr}.card{min-width:0;padding:var(--space-6);border-right:1px solid var(--border-soft)}.card:last-child{border:0}.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-8)}h2{margin:0;font-family:var(--font-display);font-size:var(--text-xl);font-weight:500;line-height:1.2;letter-spacing:-.01em}.step{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:var(--radius-pill);background:var(--surface-warm);color:var(--muted);font-family:var(--font-mono);font-size:var(--text-xs)}.field{display:grid;gap:var(--space-2)}.field label,.pair-label{color:var(--muted);font-size:var(--text-sm);letter-spacing:.01em}input{width:100%;min-height:44px;padding:0 var(--space-3);color:var(--fg);background:var(--surface);border:1px solid var(--border-soft);border-radius:var(--radius-sm);transition:border-color var(--motion-fast) var(--ease-standard),box-shadow var(--motion-fast) var(--ease-standard)}input:hover{border-color:var(--meta)}input:focus-visible{border-color:var(--fg)}.split{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);align-items:end}.btn{min-height:44px;padding:0 var(--space-4);border:1px solid transparent;border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:500;letter-spacing:.02em;transition:background var(--motion-fast) var(--ease-standard),border-color var(--motion-fast) var(--ease-standard),transform var(--motion-fast) var(--ease-standard)}.btn:active{transform:translateY(1px)}.btn-primary{color:var(--accent-on);background:var(--accent);box-shadow:0 0 0 1px var(--accent)}.btn-primary:hover{background:var(--accent-hover)}.btn-secondary{color:var(--fg-2);background:var(--surface-warm);border-color:var(--border-soft)}.btn-secondary:hover,.btn-quiet:hover{background:var(--border-soft);border-color:var(--meta)}.btn-quiet{color:var(--fg-2);background:transparent;border-color:var(--border-soft)}.calculation{display:grid;gap:var(--space-2);padding:var(--space-4);border-radius:var(--radius-sm);background:var(--surface-warm)}.calculation-value{display:flex;align-items:baseline;justify-content:space-between;gap:var(--space-2)}.calculation-value strong{font-family:var(--font-display);font-size:var(--text-2xl);font-weight:500;letter-spacing:-.01em}.calculation-value span{color:var(--muted);font-size:var(--text-sm)}.override{margin-top:var(--space-4)}.check{padding:var(--space-4);border:1px solid var(--border-soft);border-radius:var(--radius-sm);background:var(--surface-warm)}.check-meta{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3)}.check-meta .field label{font-size:var(--text-xs);letter-spacing:.02em}.check-actions{display:flex;gap:var(--space-2);margin-top:var(--space-4)}.check-actions .btn{min-height:38px;padding-inline:var(--space-3)}.remove{color:var(--danger);background:var(--surface);border-color:var(--border-soft)}.remove:hover{border-color:var(--danger)}.status{display:none;margin:var(--space-3) 0 0;color:var(--muted);font-size:var(--text-sm)}.status.show{display:block}@media(max-width:1050px){.batch-grid{grid-template-columns:1fr 1fr}.card:nth-child(2){border-right:0}.card:nth-child(-n+2){border-bottom:1px solid var(--border-soft)}}@media(max-width:640px){.workspace{padding:var(--space-4)}.shell{border-radius:var(--radius-md)}.batch-grid{grid-template-columns:1fr}.card{padding:var(--space-5);border-right:0;border-bottom:1px solid var(--border-soft)}.card:last-child{border-bottom:0}.card-header{margin-bottom:var(--space-6)}.split{grid-template-columns:1fr}.split .btn{width:100%}}
  </style>
</head>
<body>
  <main class="workspace" data-od-id="batch-components-prototype">
    <section class="shell" aria-label="Batch configuration components" data-od-id="batch-components-shell">
      <div class="progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="batch-grid">
        <article class="card" data-od-id="batch-details-card"><header class="card-header"><h2 data-od-id="batch-details-heading">Batch details</h2><span class="step">01</span></header><div class="field"><label for="finish-date">Finish date</label><input id="finish-date" type="date" value="2026-08-16" data-od-id="finish-date-control"></div></article>
        <article class="card" data-od-id="profile-inputs-card"><header class="card-header"><h2 data-od-id="profile-inputs-heading">Profile inputs</h2><span class="step">02</span></header><div class="split"><div class="field"><label for="total-weight">&lt;input metric&gt;</label><input id="total-weight" value="800" inputmode="decimal" data-od-id="total-weight-control"></div><button class="btn btn-primary" id="update-inputs" type="button" data-od-id="update-inputs-cta">Update inputs</button></div><p class="status" id="input-status" role="status">Inputs updated</p></article>
        <article class="card" data-od-id="profile-calculations-card"><header class="card-header"><h2 data-od-id="profile-calculations-heading">Profile calculations</h2><span class="step">03</span></header><div class="calculation" data-od-id="salt-calculation"><span class="pair-label">&lt;formula output name&gt;</span><div class="calculation-value"><strong>&lt;metric&gt;</strong><span>suggested</span></div></div><div class="override split"><div class="field"><label for="salt-override">Override</label><input id="salt-override" inputmode="decimal" aria-label="Override salt calculation"></div><button class="btn btn-secondary" id="override-button" type="button" data-od-id="override-cta">Override</button></div><p class="status" id="override-status" role="status">Override saved</p></article>
        <article class="card" data-od-id="recurring-checks-card"><header class="card-header"><h2 data-od-id="recurring-checks-heading">Recurring checks</h2><button class="btn btn-quiet" id="add-check" type="button" data-od-id="add-check-control">Add check</button></header><div class="check" data-od-id="recurring-check-no-mold"><div class="field"><label for="check-name">Check name</label><input id="check-name" value="No mold"></div><div class="check-meta"><div class="field"><label for="next-check">Next</label><input id="next-check" type="date" value="2026-08-12"></div><div class="field"><label for="every-days">Every</label><input id="every-days" value="3" inputmode="numeric"></div></div><div class="check-actions"><button class="btn btn-secondary" id="save-name" type="button" data-od-id="save-name-cta">Save name</button><button class="btn remove" id="remove-check" type="button" data-od-id="remove-check-control">Remove</button></div></div><p class="status" id="check-status" role="status">Check updated</p></article>
      </div>
    </section>
  </main>
  <script>
    const showStatus=(id,message)=>{const status=document.getElementById(id);status.textContent=message;status.classList.add('show');setTimeout(()=>status.classList.remove('show'),2200)};
    document.getElementById('update-inputs').onclick=()=>showStatus('input-status','Inputs updated');
    document.getElementById('override-button').onclick=()=>showStatus('override-status','Override saved');
    document.getElementById('save-name').onclick=()=>showStatus('check-status','Check updated');
    document.getElementById('remove-check').onclick=()=>showStatus('check-status','Check removed');
    document.getElementById('add-check').onclick=()=>showStatus('check-status','Add check selected');
  </script>


</body></html>
